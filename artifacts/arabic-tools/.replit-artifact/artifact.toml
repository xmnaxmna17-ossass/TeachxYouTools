kind = "web"
previewPath = "/"
title = "Arabic AI Tools Platform"
version = "1.0.0"
id = "artifacts/arabic-tools"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25328

[services.development]
run = "pnpm --filter @workspace/arabic-tools run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arabic-tools", "run", "build" ]
publicDir = "artifacts/arabic-tools/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25328"
BASE_PATH = "/"
